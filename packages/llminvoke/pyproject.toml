[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llminvoke"
version = "0.3.25"
description = "Shared LLM invocation layer — bridges uniinfer + credgoo (call_llm + invoke_llm + stream_llm)"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
dependencies = ["uniinfer", "credgoo", "pyyaml"]

[tool.uv.sources]
uniinfer = { git = "https://github.com/devskale/python-openutils.git", subdirectory = "packages/uniinfer", rev = "main" }
credgoo = { git = "https://github.com/devskale/python-openutils.git", subdirectory = "packages/credgoo", rev = "main" }

[tool.hatch.build.targets.wheel]
packages = ["llminvoke"]

[tool.hatch.build.targets.wheel.force-include]
"llminvoke/models.yml" = "llminvoke/models.yml"

[tool.uv]
# Ein zu altes uv soll LAUT verweigern, statt Locks still zurückzudrehen: vor
# 0.12.23 schrieb uv Lock-Revision 3, seither 5 — gemischte Versionen machten
# aus jedem `uv lock` ein Format-Pingpong (Issue uv-lock-revision-pingpong-uniinfer;
# hier begann es: uniinfer/uv.lock pendelte zwischen 5 und 3).
required-version = ">=0.12.23"
