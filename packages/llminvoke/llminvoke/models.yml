# ── Global default profile ─────────────────────────────────────────────
# The fallback when nothing else is specified. Per-client overrides live in
# clients.yml / team settings. See ADR 0004 for the full precedence chain.
default:
  # 2026-10-22 (User): hab@DGX Production-Default — Dreier-Messreihe: DGX ttfb
  # 0,5-0,7 s / ~340 chars/s vs. Aqueduct ttfb 20-31 s / Trickle-Bis 19 min.
  # BEKANNTES RISIKO (22.10.): eine Synthese (10,7k-Token-Prompt) bekam 5x LEER
  # von der DGX — Aqueduct-Backup faengt (erster Backup-Eintrag, invers).
  model: hab@qwen3.6-35b
  # Backup-Kette (ADR 0004 §4): transient erschöpft / permanent → nächstes Glied.
  # Der Schnell-Schalter ist die runtime clients.yml (`model:`-Zeile, mtime-Reload,
  # kein Restart); Backups fließen aus jeder Schicht, env pinnt nur den Primary.
  backups:
    # 2026-10-22: Aqueduct erster Backup (invers — DGX-Primary, Aqueduct faengt,
    # inkl. des bekannten DGX-Synthese-Leerfalls).
    - tu@qwen-3.6-35b-vllm
    # 2026-10-30 (User): Kette hab → vllm → 3.8-27b (beide Aqueduct-Karten).
    - tu@qwen-3.8-27b
    # 2026-10-30 (User): gemini-flash-lite ENTFERNT — nicht DSGVO-konform;
    # Gemini darf nur offene Doks sehen (AAB/FB-Auszug), nie als genereller
    # Backup (könnte Bieter-Unterlagen empfangen). Cross-Provider-Anchor
    # bewusst geopfert; Gemini bleibt im Katalog für offene-Dok-Tasks.
  temperature: 0.7
  max_tokens: 10000
  retry:
    attempts: 3              # per model before escalating to next backup
    backoff: exponential     # exponential | fixed
    base_delay: 2.0          # seconds — first retry wait
    max_delay: 30.0          # backoff cap
    honor_retry_after: true  # obey Retry-After header on 429s

# ── Per-package task-type defaults (optional) ──────────────────────────
# Packages can declare per-task overrides here. These are the ENGINEERING
# defaults; clients override the BUSINESS choice (which model) in clients.yml.
packages:
  pdf2md:
    temperature: 0.2
    max_tokens: 4096
    tasks:
      # VLM-Aufrufe (polish/nail-auto-rescue/signatures-VLM) laufen über die
      # API (vLLM-Endpunkt hab=DGX) — kein lokales Binary. Visuelles Lesen
      # der Seitenbilder: Qwen3.6-35B (User 2026-10-30).
      vlm:
        model: hab@qwen3.6-35b
        max_tokens: 8192  # ganzseitige VLM-Neuschreibungen (polish) — 4k clippt dichte Scan-Seiten
  md2blank:
    # (2026-10-09) war DOPPELT in dieser Datei — YAML last-wins hatte die
    # tasks fnamer/blank still verworfen; zusammengeführt (einziger Block jetzt).
    max_tokens: 16384
    temperature: 0.7
    tasks:
      fnamer:
        model: openrouter@google/gemma-3-27b-it:free
      blank:
        model: hab@qwen3.6-35b

  strukt2meta:
    max_tokens: 16384
    temperature: 0.7
    tasks:
      kriterien:
        # 2026-10-30 (User): GLM 5.3 744B als Grossmodell für den AAB-Review
        # (offene Dokumente). Zuvor hab@qwen3.6-35b (2026-10-22, 397b parkte).
        model: tu@glm-5.3-744b-experimental
        max_tokens: 32768
  agentos:
    # 2026-10-30 (User): Vergabedaten-Default — agentos verarbeitet Bieter-
    # Unterlagen; die Backup-Kette wird auf DSGVO-Provider gefiltert (Gemini &
    # Co. fallen selbst heraus, falls jemand sie später wieder in defaults
    # aufnimmt). Offene-Dok-Tasks (AAB/FB) können das pro Task lockern.
    dsgvo_required: true
    temperature: 0.7
    max_tokens: 10000
    tasks:
      # nothink steps — fast classification/routing/extraction (thinking wastes latency).
      # temperature: 0 → these are deterministic classifications/extractions;
      # variance there is pure noise (e.g. retrieval returning a phantom filename
      # on one run but not another). Pinning 0 makes routing/retrieval/date stable.
      stepRoute: {temperature: 0, request_kwargs: {chat_template_kwargs: {enable_thinking: false}}}
      stepPasRoute: {temperature: 0, request_kwargs: {chat_template_kwargs: {enable_thinking: false}}}
      stepNeedsContext: {temperature: 0, request_kwargs: {chat_template_kwargs: {enable_thinking: false}}}
      stepRetrieve: {temperature: 0.2, request_kwargs: {chat_template_kwargs: {enable_thinking: false}}}
      precheck: {temperature: 0, request_kwargs: {chat_template_kwargs: {enable_thinking: false}}}
      stepDateExtract: {temperature: 0, request_kwargs: {chat_template_kwargs: {enable_thinking: false}}}
      # AAB-Anforderungs-Extraktion (FAP gather) — 2026-10-30 (User): GLM 5.3
      # 744B als Grossmodell für AAB-Reviews (offene Dokumente). temperature/
      # nothink-Profile bleiben; bei Review-Qualität-Mangel thinking ON erwägen.
      stepAabExtract: {temperature: 0.2, model: tu@glm-5.3-744b-experimental, request_kwargs: {chat_template_kwargs: {enable_thinking: false}}}
      stepLoopFactsheet: {temperature: 0, request_kwargs: {chat_template_kwargs: {enable_thinking: false}}}
      # Orchestrator per-doc assessment — nothink. The per-doc call is a
      # structured classification (does THIS doc cover the criterion?) not deep
      # reasoning; thinking-off is ~7× faster (15s→2s) and it runs once per doc
      # (5+ calls = the dominant cost). Thinking still ON for the final verdict:
      # stepSynthesizeCriterion (conclude) + stepAssess (legacy batch) below.
      stepOrchestrateDoc: {temperature: 0.2, request_kwargs: {chat_template_kwargs: {enable_thinking: false}}}
      # thinking-enabled steps (deep analysis) — judgment steps.
      # Hybrid nondeterminism policy: temperature 0.2 (low) as the DEFAULT —
      # reproducible verdicts, keeps most of the reasoning flexibility vs 0.
      # Remaining variance on ambiguous verdicts is handled by worker-side
      # majority-vote escalation on low-confidence results (see
      # auditflow-nondeterminism issue). Covers both paths:
      stepAssess: {temperature: 0.2}        # standard-path assessor
      stepSynthesis: {temperature: 0.2}     # standard-path synthesis
      stepFapArmAudit: {temperature: 0.2}   # FAP per-doc audit arm
      stepFapSynthesis: {temperature: 0.2}  # FAP synthesis
      stepFirmenstruktur: {}
