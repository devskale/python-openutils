[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "promptloader"
version = "0.1.10"
description = "Shared workflow-prompt loader for the kontext.one engine — 5-tier resolution (literal → $KONTEXT_PROMPTS_DIR → clone → CWD → bundled) + prompt-set observability"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "skale.dev", email = "dev@skale.dev" }]
dependencies = ["pyyaml>=5", "python-frontmatter>=1.0"]

[tool.hatch.build.targets.wheel]
packages = ["promptloader"]

[tool.uv]
# Ein zu altes uv soll LAUT verweigern, statt Locks still zurückzudrehen: vor
# 0.12.23 schrieb uv Lock-Revision 3, seither 5 — gemischte Versionen machten
# aus jedem `uv lock` ein Format-Pingpong (Issue uv-lock-revision-pingpong-uniinfer;
# hier begann es: uniinfer/uv.lock pendelte zwischen 5 und 3).
required-version = ">=0.12.23"
