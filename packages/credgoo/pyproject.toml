[project]
name = "credgoo"
version = "0.1.19"
description = "A package for securely retrieving API keys from Google Sheets"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    {name = "skale.dev", email = "dev@skale.dev"}
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "requests",
]

[project.urls]
Homepage = "https://github.com/devskale/python-openutils/tree/master/packages/credgoo"

[project.scripts]
credgoo = "credgoo.credgoo:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.4.2",
]

[tool.uv]
# Ein zu altes uv soll LAUT verweigern, statt Locks still zurückzudrehen: vor
# 0.12.23 schrieb uv Lock-Revision 3, seither 5 — gemischte Versionen machten
# aus jedem `uv lock` ein Format-Pingpong (Issue uv-lock-revision-pingpong-uniinfer;
# hier begann es: uniinfer/uv.lock pendelte zwischen 5 und 3).
required-version = ">=0.12.23"
